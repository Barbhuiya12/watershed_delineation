[workspace]
members = [
    ".",
    "crates/core",
]

[workspace.dependencies]
hfx = "0.5.0"

[package]
name = "incline-watershed-system"
version = "1.0.0"
edition = "2024"
authors = [
    "Siddik Barbhuiya <siddikbarbhuiya@gmail.com>",
    "Vivek Gupta <vivek@iitmandi.ac.in>",
    "Nicolas Lazaro <pourpoint engine author>",
]
description = "High-performance hydrographic watershed delineation and morphometric analysis system, built on the pourpoint engine (by Nicolas Lazaro)"
repository = "https://github.com/Barbhuiya12/watershed_delineation"
homepage = "https://incline.iitmandi.ac.in"
license = "MIT"

[[bin]]
name = "incline-watershed-system"
path = "src/main.rs"

[dependencies]
pourpoint-core = { path = "crates/core" }
hfx = { workspace = true }
serde_json = "1"
geo = "0.29"
